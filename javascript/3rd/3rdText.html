<!DOCTYPE html>
<html lang = "ko">
<head>
     <meta charset ="UTF-8">
     <meta name="viewport" content="width=device-width, initial-scale=1.0">
     <meta http-equiv="X-UA-Compatible" content="ie=edge">
     <title>나이 계산하기</title>
     <style>
         body {
             font-size:2.9em;
             text-align: left;
         }
     </style>
</head>
<body>
     <script>
         var birthYear = prompt("당신이 태어난 연도를 입력하세요.");
         var currentYear =2026;
         var age = currentYear - birthYear +1;

         document.write("<h2>당신의 나이는" + age +"살입니다.</h2>");
     </script>
</body>
</html>
